# Every pull request runs the three suites that guard this project, so a review never has to ask "does it still pass?".
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything back: reading the code is the whole job.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit behind the tag: a tag can be moved to other code, a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Tests
        working-directory: backend
        run: mvn -B --no-transfer-progress test

  ai-service:
    name: AI service (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: ai-service
        run: pip install -r requirements-dev.txt
      - name: Tests
        working-directory: ai-service
        # The suite covers extraction, grounding and the checks that drop unsupported claims; it never calls Gemini.
        # These two only let a client object be constructed without Google credentials — nothing authenticates and
        # no request is sent. A test that needs a model stubs it.
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "false"
          GEMINI_API_KEY: "not-a-real-key-no-call-is-made"
        run: python -m pytest tests -q

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        # frontend/package-lock.json is committed, so this install is reproducible.
        run: npm ci
      # The build has to come first: Next generates the route types (PageProps, LayoutProps) that the app's own
      # pages are typed against, so tsc on a fresh checkout has nothing to resolve them to.
      - name: Build
        working-directory: frontend
        run: npx next build
      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit

  extension:
    name: Autofill extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install jsdom
        # Pinned, so a change in the DOM library can never be mistaken for a change in the filler's behaviour.
        run: npm install --no-save --no-package-lock jsdom@29.1.1
      - name: Form-filling rules
        # Proves the filler still refuses to submit, to overwrite typed values, or to touch a password or file field.
        run: node extension/fill.test.mjs
