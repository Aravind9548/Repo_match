server:
  port: ${PORT:8081}
  # Trust X-Forwarded-For from the hosting proxy so rate limits see the real client IP.
  forward-headers-strategy: framework

spring:
  application:
    name: repomatch-backend
  config:
    # Local dev: pick up the repo-root .env (KEY=VALUE is valid .properties syntax).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/repomatch}
    username: ${POSTGRES_USER:repomatch}
    password: ${POSTGRES_PASSWORD:repomatch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # Alert emails. With a Gmail account: MAIL_USERNAME=you@gmail.com and an App Password (not your login password).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

repomatch:
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    # Re-use a user's cached repos for this long before hitting GitHub again.
    cache-ttl: 10m
    max-readme-chars: 12000
    max-parallel-requests: 8
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    # On Cloud Run the AI service is private; the backend authenticates with an ID token for this audience.
    audience: ${AI_SERVICE_AUDIENCE:}
    connect-timeout: 5s
    read-timeout: 180s
  analysis:
    default-top-k: 5
    max-top-k: 10
    # Candidates sent to the LLM re-ranker: max(top-k + extra, min).
    rerank-pool-extra: 3
    rerank-pool-min: 12
    # Short keyword JDs make near-empty repos look deceptively similar; they only fill leftover LLM slots.
    min-readme-chars: 100
  limits:
    # Each LLM call costs real money (~$0.08 with Gemini 3.1 Pro); cap it for public deployments.
    llm-calls-per-client-per-hour: ${LLM_CALLS_PER_CLIENT_PER_HOUR:5}
    llm-calls-per-day: ${LLM_CALLS_PER_DAY:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  notifications:
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:}
    cron-secret: ${JOBS_CRON_SECRET:}
    link-secret: ${TRACKER_LINK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
